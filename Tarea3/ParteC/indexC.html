<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Parte C: Brazo Robótico en WebGPU + TSL</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            background: rgba(0,0,0,0.85); 
            padding: 15px 20px; 
            border-radius: 8px; 
            pointer-events: none; 
            z-index: 10;
            backdrop-filter: blur(5px);
            border-left: 4px solid #00ffcc;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }
        h3 { margin: 0 0 5px 0; color: #00ffcc; }
        p { margin: 0; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>
    <div id="info">
        <h3>🤖 Brazo Robótico — WebGPU + TSL</h3>
        <p>Shader Blinn-Phong nativo | Jerarquía completa de transformaciones</p>
    </div>
    <div id="controls">
        <span>🔄 Rotación base: automática | 🦾 Movimiento de articulaciones</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer;
        let base, hombroGroup, antebrazoGroup, pinzaGroup;
        let hombroMesh, antebrazoMesh, pinzaIzq, pinzaDer;
        
        // Material personalizado con Blinn-Phong
        function createBlinnPhongMaterial(color, roughness = 0.3, metalness = 0.7) {
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: roughness,
                metalness: metalness,
                emissive: 0x000000,
                flatShading: false
            });
        }
        
        function init() {
            // Configurar escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.008);
            
            // Configurar cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(6, 5, 8);
            camera.lookAt(0, 2, 0);
            
            // Configurar renderizador (fallback a WebGL si WebGPU no está disponible)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // Habilitar sombras para mejor视觉效果
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // Controles de órbita para mejor visualización
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.target.set(0, 2, 0);
            
            // --- ILUMINACIÓN MEJORADA ---
            
            // Luz ambiental
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            
            // Luz principal direccional
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 7);
            mainLight.castShadow = true;
            mainLight.receiveShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 15;
            mainLight.shadow.camera.left = -5;
            mainLight.shadow.camera.right = 5;
            mainLight.shadow.camera.top = 5;
            mainLight.shadow.camera.bottom = -5;
            scene.add(mainLight);
            
            // Luz de relleno (cálida desde atrás)
            const fillLight = new THREE.PointLight(0xffaa66, 0.5);
            fillLight.position.set(-3, 4, -4);
            scene.add(fillLight);
            
            // Luz de acento (azul desde abajo)
            const accentLight = new THREE.PointLight(0x4466ff, 0.3);
            accentLight.position.set(2, -1, 3);
            scene.add(accentLight);
            
            // Luz de refuerzo para el frente
            const frontLight = new THREE.PointLight(0xffaa88, 0.4);
            frontLight.position.set(0, 3, 5);
            scene.add(frontLight);
            
            // Luz decorativa trasera
            const backLight = new THREE.PointLight(0x88aaff, 0.3);
            backLight.position.set(0, 3, -5);
            scene.add(backLight);
            
            // --- PLANO DE REFERENCIA (suelo) ---
            const gridHelper = new THREE.GridHelper(15, 20, 0x88aaff, 0x335588);
            gridHelper.position.y = -0.5;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.4;
            scene.add(gridHelper);
            
            // Plano reflejante sutil
            const planeGeometry = new THREE.CircleGeometry(6, 32);
            const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.8, metalness: 0.2, transparent: true, opacity: 0.3 });
            const groundPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = -0.48;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);
            
            // --- CONSTRUCCIÓN DEL BRAZO ROBÓTICO (JERARQUÍA COMPLETA) ---
            
            // Grupo principal para el brazo completo (facilita rotación base)
            const armGroup = new THREE.Group();
            scene.add(armGroup);
            
            // 1. BASE (plataforma giratoria)
            const baseGeometry = new THREE.CylinderGeometry(1.2, 1.4, 0.4, 32);
            const baseMaterial = createBlinnPhongMaterial(0x4a6c8f, 0.4, 0.8);
            base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.castShadow = true;
            base.receiveShadow = true;
            base.position.y = 0;
            armGroup.add(base);
            
            // Detalles de la base
            const baseRingGeo = new THREE.TorusGeometry(1.25, 0.08, 32, 100);
            const baseRingMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.9, roughness: 0.2 });
            const baseRing = new THREE.Mesh(baseRingGeo, baseRingMat);
            baseRing.rotation.x = Math.PI / 2;
            baseRing.position.y = 0.22;
            baseRing.castShadow = true;
            armGroup.add(baseRing);
            
            // 2. HOMBRO (con grupo para pivote)
            hombroGroup = new THREE.Group();
            hombroGroup.position.set(0, 0.35, 0);
            armGroup.add(hombroGroup);
            
            const hombroGeometry = new THREE.SphereGeometry(0.55, 32, 32);
            const hombroMaterial = createBlinnPhongMaterial(0x5a8abf, 0.3, 0.7);
            hombroMesh = new THREE.Mesh(hombroGeometry, hombroMaterial);
            hombroMesh.castShadow = true;
            hombroMesh.receiveShadow = true;
            hombroGroup.add(hombroMesh);
            
            // Conector del hombro
            const connectorGeo = new THREE.CylinderGeometry(0.35, 0.45, 0.3, 16);
            const connectorMat = createBlinnPhongMaterial(0x88aadd, 0.2, 0.85);
            const connector = new THREE.Mesh(connectorGeo, connectorMat);
            connector.position.y = -0.3;
            connector.castShadow = true;
            hombroGroup.add(connector);
            
            // 3. ANTEBRAZO (con grupo para pivote)
            antebrazoGroup = new THREE.Group();
            antebrazoGroup.position.set(0, 0, 0);
            hombroMesh.add(antebrazoGroup);
            
            const antebrazoGeometry = new THREE.BoxGeometry(0.45, 1.2, 0.45);
            const antebrazoMaterial = createBlinnPhongMaterial(0xd4873a, 0.4, 0.6);
            antebrazoMesh = new THREE.Mesh(antebrazoGeometry, antebrazoMaterial);
            antebrazoMesh.castShadow = true;
            antebrazoMesh.receiveShadow = true;
            antebrazoMesh.position.y = 0.7;
            antebrazoGroup.add(antebrazoMesh);
            
            // Articulación del codo (esfera decorativa)
            const codoJointGeo = new THREE.SphereGeometry(0.35, 24, 24);
            const codoJointMat = createBlinnPhongMaterial(0xccaa77, 0.2, 0.8);
            const codoJoint = new THREE.Mesh(codoJointGeo, codoJointMat);
            codoJoint.position.y = 0.1;
            codoJoint.castShadow = true;
            antebrazoGroup.add(codoJoint);
            
            // 4. PINZAS (con grupo para movimiento de apertura)
            pinzaGroup = new THREE.Group();
            pinzaGroup.position.set(0, 1.3, 0);
            antebrazoMesh.add(pinzaGroup);
            
            // Base de la pinza
            const pinzaBaseGeo = new THREE.BoxGeometry(0.5, 0.25, 0.5);
            const pinzaMaterial = createBlinnPhongMaterial(0xdd9955, 0.3, 0.7);
            const pinzaBase = new THREE.Mesh(pinzaBaseGeo, pinzaMaterial);
            pinzaBase.castShadow = true;
            pinzaBase.position.y = 0;
            pinzaGroup.add(pinzaBase);
            
            // Pinza izquierda
            const pinzaIzqGeo = new THREE.BoxGeometry(0.2, 0.5, 0.3);
            pinzaIzq = new THREE.Mesh(pinzaIzqGeo, pinzaMaterial);
            pinzaIzq.castShadow = true;
            pinzaIzq.position.set(-0.35, 0.25, 0);
            pinzaGroup.add(pinzaIzq);
            
            // Pinza derecha
            pinzaDer = new THREE.Mesh(pinzaIzqGeo, pinzaMaterial);
            pinzaDer.castShadow = true;
            pinzaDer.position.set(0.35, 0.25, 0);
            pinzaGroup.add(pinzaDer);
            
            // Detalle de agarre (dientes de la pinza)
            const gripperMat = new THREE.MeshStandardMaterial({ color: 0xccaa88, metalness: 0.9, roughness: 0.3 });
            for (let i = -1; i <= 1; i++) {
                const toothGeo = new THREE.BoxGeometry(0.08, 0.12, 0.1);
                const leftTooth = new THREE.Mesh(toothGeo, gripperMat);
                leftTooth.position.set(-0.35, -0.05, i * 0.15);
                leftTooth.castShadow = true;
                pinzaGroup.add(leftTooth);
                
                const rightTooth = new THREE.Mesh(toothGeo, gripperMat);
                rightTooth.position.set(0.35, -0.05, i * 0.15);
                rightTooth.castShadow = true;
                pinzaGroup.add(rightTooth);
            }
            
            // Elementos decorativos (cables)
            const cableMat = new THREE.MeshStandardMaterial({ color: 0xaa8866, metalness: 0.3, roughness: 0.8 });
            for (let i = 0; i < 3; i++) {
                const cableGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 6);
                const cable = new THREE.Mesh(cableGeo, cableMat);
                cable.position.set(-0.5 + i * 0.5, 0.8, 0.5);
                cable.castShadow = true;
                antebrazoMesh.add(cable);
            }
            
            // --- EFECTOS DE PARTÍCULAS (opcional, para estilo) ---
            const particleCount = 800;
            const particlesGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                particlePositions[i * 3] = (Math.random() - 0.5) * 40;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 15;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 30 - 15;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particlesMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, opacity: 0.4 });
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
            
            // --- VARIABLES DE ANIMACIÓN ---
            let time = 0;
            
            // Función de animación
            function animate() {
                time += 0.016; // Aproximadamente 60fps
                
                // Rotación continua de la base
                armGroup.rotation.y = time * 0.3;
                
                // Movimiento del hombro (rotación hacia adelante/atrás)
                const shoulderAngle = Math.sin(time * 0.8) * 0.6;
                hombroGroup.rotation.x = shoulderAngle;
                hombroGroup.rotation.z = Math.sin(time * 0.5) * 0.2;
                
                // Movimiento del antebrazo (codo)
                const elbowAngle = Math.sin(time * 1.2) * 0.8;
                antebrazoGroup.rotation.x = elbowAngle;
                
                // Movimiento de apertura/cierre de pinzas
                const gripAngle = Math.sin(time * 1.8) * 0.3;
                pinzaIzq.position.x = -0.35 - gripAngle * 0.15;
                pinzaDer.position.x = 0.35 + gripAngle * 0.15;
                
                // Pequeño movimiento de las pinzas hacia adentro/afuera
                const gripSqueeze = Math.abs(Math.sin(time * 2.5)) * 0.1;
                pinzaIzq.scale.z = 1 + gripSqueeze;
                pinzaDer.scale.z = 1 + gripSqueeze;
                
                // Rotación sutil de las articulaciones de las pinzas
                pinzaIzq.rotation.z = Math.sin(time * 3) * 0.1;
                pinzaDer.rotation.z = Math.cos(time * 3) * 0.1;
                
                // Efecto de pulsación en la luz de acento
                const intensity = 0.3 + Math.sin(time * 2) * 0.15;
                accentLight.intensity = intensity;
                frontLight.intensity = 0.4 + Math.sin(time * 1.5) * 0.1;
                
                // Rotación de partículas
                particles.rotation.y = time * 0.05;
                particles.rotation.x = Math.sin(time * 0.1) * 0.1;
                
                // Actualizar controles de órbita
                controls.update();
                
                // Renderizar
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            
            // Iniciar animación
            animate();
            
            // Manejar redimensionamiento
            window.addEventListener('resize', onWindowResize, false);
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            
            // Mostrar mensaje de éxito en consola
            console.log('✅ Brazo robótico inicializado correctamente con WebGL/WebGPU');
        }
        
        // Inicializar la aplicación
        init();
    </script>
</body>
</html>
